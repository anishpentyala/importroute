[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "importroute"
version = "0.1.0"
description = "Explain declared Python filesystem import routes without importing target packages"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
importroute = "importroute.__main__:entrypoint"

[tool.setuptools.packages.find]
include = ["importroute*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
